name: Trade drawdown report

# Manual only: Actions tab -> "Trade drawdown report" -> Run workflow.
# Reads open_positions.json from the separate PRIVATE trade-data repo, pulls daily bars,
# and commits trade_drawdown_report.md back to that private repo (never to this public one).
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trade-drawdown
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out private trade-data repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO || format('{0}/fin-private', github.repository_owner) }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build drawdown report
        env:
          FIN_PRIVATE_DIR: private
        run: python trade_drawdown_report.py

      - name: Commit report to the PRIVATE repo
        working-directory: private
        run: |
          git config user.name "stock-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trade_drawdown_report.md
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Trade drawdown report [automated]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              break
            fi
            echo "Push/rebase attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then
              echo "::error::Could not push drawdown report after 5 attempts"
              exit 1
            fi
          done
