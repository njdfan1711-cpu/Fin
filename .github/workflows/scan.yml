name: Daily Foundation Scan

on:
  schedule:
    # 11:07 UTC (not 11:00) -- GitHub's own docs warn that scheduled
    # workflows are most likely to be delayed at the top of the hour,
    # since that's the highest-congestion trigger time across all of
    # GitHub Actions. Confirmed in practice here: the last several daily
    # runs landed 2-4 hours late (13:25/14:56 UTC instead of 11:00).
    # A few minutes off the hour avoids that congestion window.
    - cron: "7 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-foundation-scan
  cancel-in-progress: false

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build universe (Nasdaq + NYSE/AMEX)
        run: python universe_builder.py

      - name: Check for newly-live IPOs
        run: python ipo_watch.py

      - name: Scan for delisting-risk notices
        run: python delisting_risk_scan.py

      - name: Build eligible (liquidity/quality-filtered) universe
        run: python filters.py

      - name: Run fundamentals scan (records signals only, no push)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python fundamentals_scan.py

      - name: Run short interest scan (records signals only, no push)
        run: python short_interest_scan.py

      - name: Track outcomes of past picks (target/stop hit-rate)
        run: python track_outcomes.py

      - name: Commit updated state files
        run: |
          git config user.name "stock-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git config merge.signals-state.driver "python3 merge_signals_state.py %O %A %B"
          for f in universe.csv pending_ipos.json delisting_risk.json eligible.csv fundamentals_signals.json signals_state.json float_data.json metrics_cache.json outcome_history.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily scan update [automated]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              break
            fi
            echo "Push/rebase attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then
              echo "::error::Could not push signal state after 5 attempts"
              exit 1
            fi
          done
