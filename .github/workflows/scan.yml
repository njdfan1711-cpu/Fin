name: Daily Stock Scan
on:
  schedule:
    - cron: "0 12 * * 1-5" # Mon-Fri only
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build universe (Nasdaq + NYSE/AMEX)
        run: python universe_builder.py

      - name: Check for newly-live IPOs
        run: python ipo_watch.py

      - name: Commit updated state files
        run: |
          git config user.name "stock-scanner-bot"
          git config user.email "actions@://github.com"
          git add universe.csv pending_ipos.json
          git diff --staged --quiet || git commit -m "Update universe/pending IPOs [automated]"
          git push
