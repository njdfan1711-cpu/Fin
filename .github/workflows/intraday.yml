name: Intraday Technical + News Scan

on:
  schedule:
    # 13:03/13:33 UTC etc (not the exact hour/half-hour) -- same top-of-
    # hour congestion issue documented for scan.yml. A missed slot here
    # just means a 30-min wait for the next one rather than losing the
    # whole morning, but no reason not to dodge it too.
    - cron: "3,33 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intraday-technical-news-scan
  cancel-in-progress: false

jobs:
  intraday-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run technical scan (records signals only, no push)
        run: python technicals_scan.py

      - name: Run news/catalyst scan (records signals only, no push)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python news_scan.py

      - name: Compose and send alerts (requires 2+ signal confluence)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python compose_alerts.py

      - name: Commit updated signal/alert state
        run: |
          git config user.name "stock-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git config merge.signals-state.driver "python3 merge_signals_state.py %O %A %B"
          git config merge.alert-log.driver "python3 merge_alert_log.py %O %A %B"
          git config merge.daily-pushes.driver "python3 merge_daily_pushes.py %O %A %B"
          # Built-in trivial "keep whichever side is present" resolver --
          # used for files that are fully regenerated each run (see
          # .gitattributes) and have nothing to structurally merge.
          git config merge.ours.driver true
          for f in signals_state.json alert_log.json latest_alerts.md daily_pushes.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          # One timestamped snapshot per run, never overwritten -- lets
          # past trade plans (entry/stop/target) be looked back on later,
          # since latest_alerts.md itself is overwritten every run.
          if [ -d alerts_history ]; then
            git add alerts_history/
          fi
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Intraday scan update [automated]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              break
            fi
            echo "Push/rebase attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then
              echo "::error::Could not push signal state after 5 attempts"
              exit 1
            fi
          done
