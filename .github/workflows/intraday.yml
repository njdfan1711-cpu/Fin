name: Intraday Technical + News Scan

on:
  schedule:
    # Every 30 min, 13:00-21:59 UTC, weekdays -- covers NYSE hours across
    # both EST and EDT since GitHub cron is fixed UTC.
    - cron: "0,30 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intraday-technical-news-scan
  cancel-in-progress: false

jobs:
  intraday-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run technical scan (records signals only, no push)
        run: python technicals_scan.py

      - name: Run news/catalyst scan (records signals only, no push)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python news_scan.py

      - name: Compose and send alerts (requires 2+ signal confluence)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python compose_alerts.py

      - name: Commit updated signal/alert state
        run: |
          git config user.name "stock-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in signals_state.json alert_log.json latest_alerts.md; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Intraday scan update [automated]"
          git pull --rebase origin main
          git push
