name: Intraday Technical + News Scan

on:
  # Triggered externally by cron-job.org via the workflow_dispatch REST
  # API. The native `schedule:` trigger was removed 2026-09-30 -- it was
  # unreliable (hours late / not firing) and, left in place alongside
  # cron-job.org, produced duplicate and cancelled runs.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intraday-technical-news-scan
  cancel-in-progress: false

jobs:
  intraday-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run technical scan (records signals only, no push)
        run: python technicals_scan.py

      - name: Run news/catalyst scan (records signals only, no push)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python news_scan.py

      - name: Compose and send alerts (requires 2+ signal confluence)
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          # Optional repo variable (Settings > Secrets and variables > Actions > Variables).
          # When set, tapping an ntfy alert opens the styled page instead of the raw .md.
          ALERTS_PAGE_URL: ${{ vars.ALERTS_PAGE_URL }}
          # SEC EDGAR requires a descriptive User-Agent with contact info (drop_check.py).
          # Add a repo secret SEC_USER_AGENT, e.g. "Fin Greg you@email.com".
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python compose_alerts.py

      # Trade data lives in a separate PRIVATE repo (read-only use here). If this checkout
      # fails (token missing/expired), the run carries on without it -- position monitoring
      # is skipped with a visible warning -- so a token problem can never stop the alerts.
      - name: Check out private trade data
        id: private
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_REPO || format('{0}/fin-private', github.repository_owner) }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Check open positions (stop/target/drawdown/overdue)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FIN_PRIVATE_DIR: private
        run: |
          if [ "${{ steps.private.outcome }}" != "success" ]; then
            echo "::warning::Could not check out the private trade-data repo -- open positions are NOT being monitored this run. Check the PRIVATE_REPO_TOKEN secret (missing or expired?)."
          fi
          python position_monitor.py

      - name: Commit updated signal/alert state
        run: |
          git config user.name "stock-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git config merge.signals-state.driver "python3 merge_signals_state.py %O %A %B"
          git config merge.alert-log.driver "python3 merge_alert_log.py %O %A %B"
          git config merge.daily-pushes.driver "python3 merge_daily_pushes.py %O %A %B"
          # Built-in trivial "keep whichever side is present" resolver --
          # used for files that are fully regenerated each run (see
          # .gitattributes) and have nothing to structurally merge.
          git config merge.ours.driver true
          for f in signals_state.json alert_log.json latest_alerts.md latest_alerts.html daily_pushes.json position_monitor_state.json drop_checks.jsonl latest_run.json; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          # One timestamped snapshot per run, never overwritten -- lets
          # past trade plans (entry/stop/target) be looked back on later,
          # since latest_alerts.md itself is overwritten every run.
          if [ -d alerts_history ]; then
            git add alerts_history/
          fi
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Intraday scan update [automated]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              break
            fi
            echo "Push/rebase attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then
              echo "::error::Could not push signal state after 5 attempts"
              exit 1
            fi
          done
