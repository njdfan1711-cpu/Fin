name: Scalp Watchlist (scalping project)

# workflow_dispatch ONLY, same reasoning as scalp_backtest.yml: trigger it
# from cron-job.org (once per trading morning, AFTER the Daily Scan has
# refreshed eligible.csv) instead of relying on GitHub's own scheduler.
# Reads eligible.csv, writes scalping/scalp_watchlist.csv. Uses no
# external packages and no network access besides git itself.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scalp-watchlist
  cancel-in-progress: false

jobs:
  scalp-watchlist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build watchlist
        working-directory: scalping
        run: python build_watchlist.py

      - name: Commit updated watchlist
        run: |
          git config user.name "stock-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scalping/scalp_watchlist.csv
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Scalp watchlist update [automated]"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              break
            fi
            echo "Push/rebase attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
            if [ "$attempt" = "5" ]; then
              echo "::error::Could not push scalp watchlist after 5 attempts"
              exit 1
            fi
          done
